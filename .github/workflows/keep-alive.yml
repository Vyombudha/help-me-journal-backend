name: Keep backend awake

on:
  schedule:
    # Every 10 minutes (GitHub may delay scheduled runs by a few minutes)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 \
            "$BACKEND_URL/health"
